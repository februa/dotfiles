# AI アシスタント (avante.nvim) {{{
[[plugins]]
repo = 'nvim-lua/plenary.nvim'
merged = false

[[plugins]]
repo = 'MunifTanjim/nui.nvim'
merged = false

[[plugins]]
repo = 'yetone/avante.nvim'
depends = ['plenary.nvim', 'nui.nvim', 'nvim-web-devicons', 'nvim-cmp', 'render-markdown.nvim', 'nvim-treesitter']
merged = false
on_cmd = ['AvanteAsk', 'AvanteEdit', 'AvanteToggle', 'AvanteChat', 'AvanteChatNew', 'AvanteHistory', 'AvanteClear', 'AvanteFocus', 'AvanteRefresh', 'AvanteSwitchProvider', 'AvanteModels']
hook_add = '''
" AI アシスタント (avante.nvim)
"   saa: AI に質問（ビジュアル選択時は選択範囲について質問）
"   san: 新しい会話を開始して質問
"   sat: サイドバー表示切替
"   sae: 選択範囲を AI で編集
"   sar: AI の最後の応答をリフレッシュ
"   sah: 会話履歴を表示
"   sam: モデル一覧 / 切替
nnoremap <silent> saa <Cmd>AvanteAsk<CR>
xnoremap <silent> saa :AvanteAsk<CR>
nnoremap <silent> san <Cmd>AvanteChatNew<CR>
nnoremap <silent> sat <Cmd>AvanteToggle<CR>
xnoremap <silent> sae :AvanteEdit<CR>
nnoremap <silent> sar <Cmd>AvanteRefresh<CR>
nnoremap <silent> sah <Cmd>AvanteHistory<CR>
nnoremap <silent> sam <Cmd>AvanteModels<CR>
'''
hook_source = '''
lua require('plugins.avante')
'''
hook_post_update = '''
lua <<EOF
local path = vim.fn['dpp#get']('avante.nvim').path
if vim.fn.has('win32') == 1 then
  vim.fn.system({'powershell', '-ExecutionPolicy', 'Bypass', '-File', path .. '/Build.ps1', '-BuildFromSource', 'false'})
else
  local sh = path .. '/build.sh'
  if vim.fn.filereadable(sh) == 1 then vim.fn.system({'bash', sh}) end
end
EOF
'''
