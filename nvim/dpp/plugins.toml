# コメントトグル
[[plugins]]
repo = 'numToStr/Comment.nvim'

hook_source = '''
" コメントトグル（ts-context-commentstring 連携）
"   gcc: 行コメントトグル
"   gc + モーション: 範囲コメント（例: gcip でパラグラフ）
"   gc: ビジュアルモードで選択範囲をコメント
lua <<EOF
require('Comment').setup({
  pre_hook = function(ctx)
    local ok, ts_comment = pcall(require, 'ts_context_commentstring.integrations.comment_nvim')
    if ok then
      return ts_comment.create_pre_hook()(ctx)
    end
  end,
})
EOF
'''

# 自動括弧閉じ
[[plugins]]
repo = 'windwp/nvim-autopairs'
hook_source = '''
" 自動括弧閉じ
"   ( → ()  [ → []  { → {}  ' → ''  " → ""
"   閉じ括弧の上で入力するとスキップ、BS で対も削除
lua require('nvim-autopairs').setup()
'''

# Git 差分マーク
[[plugins]]
repo = 'lewis6991/gitsigns.nvim'
hook_source = '''
" Git 差分マーク（signcolumn に自動表示）
"   左端に + (追加) ~ (変更) _ (削除) を表示
lua require('gitsigns').setup()
'''

# Git 操作
[[plugins]]
repo = 'tpope/vim-fugitive'
hook_add = '''
" Git 操作
"   gs: git status（ステージング/アンステージングも可能）
"   gd: 現在のファイルの diff を分割表示
"   gb: git blame（行ごとの最終変更者を表示）
"   gl: git log を1行表示
nnoremap <silent> gs <Cmd>Git<CR>
nnoremap <silent> gd <Cmd>Gdiffsplit<CR>
nnoremap <silent> gb <Cmd>Git blame<CR>
nnoremap <silent> gl <Cmd>Git log --oneline<CR>
'''

# テキスト囲み操作
[[plugins]]
repo = 'kylechui/nvim-surround'
hook_source = '''
" テキスト囲み操作
"   ys{motion}{char}: 囲み追加（例: ysiw" → カーソル下の単語を "" で囲む）
"   ds{char}: 囲み削除（例: ds" → "" を削除）
"   cs{old}{new}: 囲み変更（例: cs"' → "" を '' に変更）
lua require('nvim-surround').setup()
'''



