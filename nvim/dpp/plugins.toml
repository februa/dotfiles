# フォーマッター {{{
[[plugins]]
repo = 'stevearc/conform.nvim'
hook_source = '''
" 保存時自動フォーマット
"   TypeScript/JavaScript/HTML/CSS/JSON: prettierd
"   \f はフォーマットキーマップ（lsp.lua 側で定義済み）
lua <<EOF
require('conform').setup({
  formatters_by_ft = {
    typescript = { 'prettierd' },
    typescriptreact = { 'prettierd' },
    javascript = { 'prettierd' },
    javascriptreact = { 'prettierd' },
    html = { 'prettierd' },
    css = { 'prettierd' },
    json = { 'prettierd' },
    markdown = { 'prettierd' },
  },
  format_on_save = {
    timeout_ms = 2000,
    lsp_format = 'fallback',
  },
})
EOF
'''
