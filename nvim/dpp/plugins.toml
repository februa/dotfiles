# 通知 {{{
[[plugins]]
repo = 'j-hui/fidget.nvim'
hook_source = '''
" 通知 + LSP 進捗表示（vim.notify を fidget に置き換え）
" インストール中は setup をスキップ: vim.notify の乗っ取りが
" dpp-ext-installer の進捗表示を妨害するため。
" dpp_reload 時の dpp#source() で再発火し正常セットアップされる。
" _dpp_fidget_ready はインストーラーの UI モード判定に使用。
lua <<EOF
if _G._dpp_installing then return end
require('fidget').setup({
  notification = {
    override_vim_notify = true,
    window = {
      winblend = 0,
    },
  },
})
_G._dpp_fidget_ready = true
EOF
'''
# }}}

