# treesitter {{{
[[plugins]]
repo = 'nvim-treesitter/nvim-treesitter'
hook_source = '''
" 構文ハイライト・埋め込み言語認識
"   :TSInstall {lang} で個別インストール、:TSUpdate で一括更新
"   Neovim 0.11 では highlight/indent は vim.treesitter で組み込み
lua require('plugins.treesitter')
'''
hook_post_update = 'TSUpdate'

[[plugins]]
repo = 'windwp/nvim-ts-autotag'
on_ft = ['html', 'javascript', 'typescript', 'javascriptreact', 'typescriptreact', 'vue', 'svelte', 'xml', 'markdown']
depends = ['nvim-treesitter']
hook_source = '''
" HTML/JSX タグ自動閉じ・リネーム
"   <div と入力すると </div> が自動挿入
"   開始タグをリネームすると閉じタグも連動
lua <<EOF
local ok, autotag = pcall(require, 'nvim-ts-autotag')
if ok then
  autotag.setup()
  local ok2, internal = pcall(require, 'nvim-ts-autotag.internal')
  if ok2 then internal.attach(vim.api.nvim_get_current_buf()) end
end
EOF
'''

[[plugins]]
repo = 'JoosepAlviste/nvim-ts-context-commentstring'
on_source = 'nvim-treesitter'
hook_source = '''
" 埋め込み言語の正しいコメント構文（JSX/TSX 等）
lua <<EOF
local ok, tsc = pcall(require, 'ts_context_commentstring')
if ok then tsc.setup({ enable_autocmd = false }) end
EOF
'''
# }}}

# 表示強化 {{{
[[plugins]]
repo = 'shellRaining/hlchunk.nvim'
hook_source = '''
" インデントガイド / チャンクハイライト
"   カーソル位置のコードブロックを線で可視化
lua <<EOF
require('hlchunk').setup({
  chunk = { enable = true },
  indent = { enable = true },
  line_num = { enable = false },
  blank = { enable = false },
})
EOF
'''

[[plugins]]
repo = 'MeanderingProgrammer/render-markdown.nvim'
on_ft = ['markdown', 'Avante']
hook_source = '''
" Markdown リッチ描画
"   見出し・リスト・チェックボックス・コードブロックを装飾表示
"   Avante サイドバーでも Markdown レンダリングを有効化
" 初回インストール中は runtimepath 未反映で require が失敗する場合がある
lua <<EOF
local ok, rm = pcall(require, 'render-markdown')
if ok then
  rm.setup({
    file_types = { 'markdown', 'Avante' },
    latex = { enabled = false },
    yaml = { enabled = false },
  })
end
EOF
'''

[[plugins]]
repo = 'm-demare/hlargs.nvim'
on_source = 'nvim-treesitter'
hook_source = '''
